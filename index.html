<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <table id="books-table">
        <tr>
            <th>Title</th>
            <th>Author</th>
            <th>Pages</th>
            <th>Read</th>
        </tr>
    </table>
    <button id="add-new">Add new book</button>

    <form action="" style="display: none;" id="book-form">
        <input type="text" placeholder="Tittle...">
        <input type="text" placeholder="Author...">
        <input type="number" placeholder="pages">
        <input type="checkbox">
        <button type="submit" id="submit-book">Submit</button>
    </form>
    <script src="script.js"></script>
</body>

</html>
